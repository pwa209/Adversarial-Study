[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-consciousness-study"
version = "0.1.0"
description = "Reproducible, staged analysis for the adversarial consciousness study"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
eeg = ["mne>=1.6,<2"]
plots = ["matplotlib>=3.8,<4"]

[project.scripts]
adversarial-study = "adversarial_study.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["adversarial_study*"]
